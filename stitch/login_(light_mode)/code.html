<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hotel Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between max-w-md mx-auto w-full">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center cursor-pointer" data-icon="ArrowLeft">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Admin Portal</h2>
</div>
<!-- Main Content Container -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-8 w-full max-w-md mx-auto">
<!-- Logo Section -->
<div class="mb-8 flex flex-col items-center">
<div class="w-20 h-20 bg-primary/10 rounded-xl flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-5xl">domain</span>
</div>
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-bold tracking-tight text-center">Welcome back</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal mt-2 text-center">
                Please enter your administrative credentials to access the dashboard.
            </p>
</div>
<!-- Login Form -->
<div class="w-full space-y-5">
<!-- Email Input -->
<div class="flex flex-col w-full">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pb-2 px-1">Work Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
<input class="form-input flex w-full rounded-lg text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary h-14 pl-12 pr-4 text-base font-normal" placeholder="admin@hotelgroup.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col w-full">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold leading-normal pb-2 px-1">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="form-input flex w-full rounded-lg text-slate-900 dark:text-slate-100 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-primary/20 focus:border-primary h-14 pl-12 pr-12 text-base font-normal" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end px-1">
<a class="text-primary text-sm font-semibold hover:underline" href="#">Forgot Password?</a>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                Sign In
                <span class="material-symbols-outlined text-lg">login</span>
</button>
</div>
<!-- Illustration/Decorative Element -->
<div class="mt-12 w-full">
<div class="w-full h-32 rounded-xl bg-gradient-to-br from-primary/5 to-primary/20 border border-primary/10 flex items-center justify-center overflow-hidden relative" data-alt="Abstract blue gradient pattern background">
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, #2463eb 1px, transparent 0); background-size: 24px 24px;"></div>
<div class="flex items-center gap-4 z-10">
<span class="material-symbols-outlined text-primary/40 text-4xl">shield_person</span>
<div class="h-8 w-px bg-primary/20"></div>
<span class="text-primary/60 font-medium text-sm">Secure Admin Access</span>
</div>
</div>
</div>
</main>
<!-- Footer Section -->
<footer class="mt-auto py-8 px-6 w-full max-w-md mx-auto">
<div class="flex flex-col items-center gap-4">
<div class="flex items-center gap-6">
<a class="text-slate-500 dark:text-slate-400 text-xs font-medium hover:text-primary transition-colors" href="#">Privacy Policy</a>
<div class="w-1 h-1 rounded-full bg-slate-300"></div>
<a class="text-slate-500 dark:text-slate-400 text-xs font-medium hover:text-primary transition-colors" href="#">Terms of Service</a>
<div class="w-1 h-1 rounded-full bg-slate-300"></div>
<a class="text-slate-500 dark:text-slate-400 text-xs font-medium hover:text-primary transition-colors" href="#">Help Center</a>
</div>
<p class="text-slate-400 dark:text-slate-500 text-[10px] uppercase tracking-widest font-bold">
                © 2024 Hotel Group Systems
            </p>
</div>
</footer>
</body></html>
