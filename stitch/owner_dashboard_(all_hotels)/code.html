<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Owner Dashboard - Multi-Hotel Overview</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a2b3d",
                        "background-light": "#f6f7f7",
                        "background-dark": "#15191d",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-tab .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header Section -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-primary/30 px-4 py-4">
<div class="flex items-center justify-between mb-4">
<h1 class="text-xl font-bold tracking-tight">Overview</h1>
<button class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-primary/50 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">notifications</span>
</button>
</div>
<div class="relative">
<label class="sr-only" for="hotel-switcher">Select Hotel</label>
<select class="w-full bg-slate-100 dark:bg-primary border-none rounded-lg py-3 px-4 text-sm font-medium focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer" id="hotel-switcher">
<option value="all">All Hotels</option>
<option value="grand-plaza">Grand Plaza</option>
<option value="beach-resort">Beach Resort</option>
<option value="mountain-lodge">Mountain Lodge</option>
</select>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 px-4 py-6 space-y-6 max-w-md mx-auto w-full pb-24">
<!-- Aggregate KPIs -->
<section class="grid grid-cols-1 gap-4">
<!-- Revenue Card with Sparkline -->
<div class="bg-white dark:bg-primary rounded-xl p-5 shadow-sm border border-slate-100 dark:border-primary/20">
<div class="flex justify-between items-start mb-2">
<div>
<p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total Revenue</p>
<h2 class="text-3xl font-bold mt-1">$125,000</h2>
</div>
<div class="flex items-center gap-1 text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded-full text-xs font-bold">
<span class="material-symbols-outlined text-sm">trending_up</span>
                        12%
                    </div>
</div>
<!-- Sparkline Visualization -->
<div class="h-20 w-full mt-4">
<svg class="w-full h-full overflow-visible" viewbox="0 0 400 100">
<defs>
<lineargradient id="sparklineGradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#10b981" stop-opacity="0.2"></stop>
<stop offset="100%" stop-color="#10b981" stop-opacity="0"></stop>
</lineargradient>
</defs>
<path d="M0,80 Q40,70 80,40 T160,50 T240,20 T320,60 T400,30" fill="none" stroke="#10b981" stroke-linecap="round" stroke-width="3"></path>
<path d="M0,80 Q40,70 80,40 T160,50 T240,20 T320,60 T400,30 V100 H0 Z" fill="url(#sparklineGradient)"></path>
</svg>
</div>
</div>
<!-- Smaller KPI Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="bg-white dark:bg-primary rounded-xl p-5 shadow-sm border border-slate-100 dark:border-primary/20">
<p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Bookings</p>
<div class="flex items-end justify-between mt-2">
<h3 class="text-2xl font-bold">450</h3>
<span class="text-emerald-500 text-xs font-bold">+5%</span>
</div>
</div>
<div class="bg-white dark:bg-primary rounded-xl p-5 shadow-sm border border-slate-100 dark:border-primary/20">
<p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Active Orders</p>
<div class="flex items-end justify-between mt-2">
<h3 class="text-2xl font-bold">18</h3>
<span class="text-orange-500 text-xs font-bold">-2%</span>
</div>
</div>
</div>
</section>
<!-- Individual Properties Section -->
<section class="space-y-4">
<div class="flex items-center justify-between">
<h2 class="text-lg font-bold">Property Performance</h2>
<button class="text-sm font-medium text-slate-500">See all</button>
</div>
<!-- Hotel Card: Grand Plaza -->
<div class="bg-white dark:bg-primary/40 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-primary/30 flex items-center gap-4">
<div class="w-16 h-16 rounded-lg overflow-hidden bg-slate-200 shrink-0">
<img alt="Grand Plaza Luxury Hotel Exterior" class="w-full h-full object-cover" data-alt="Luxury hotel building with large glass windows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQREfM9uhmfMhpTpU2HYb3bH0oHzcBxTfV38VupVCaIq-CJVmkYndb_LIjSHKn5FJ_WN1yfkam8Dh5G1fL3IL-XSbIjeQHL_yQVoE2qFoaEdgOJM7wVVFDIz4PWaC7GRB7pJsvVzl4wpe49tlA5o9dekRnuQZhx4dvFq4SiD5sh5vcbR9DiyQJ_ID2iPJf_21ly9jaDQKwak2mZCc9vqxF15ouId3iwKIJf-2Xpt7akAmALoVcM8VhnhF-cwezULpyf2XTfdjvkkc0"/>
</div>
<div class="flex-1 min-w-0">
<h4 class="font-bold text-base truncate">Grand Plaza</h4>
<div class="flex justify-between items-center mt-1">
<p class="text-xs text-slate-500 dark:text-slate-400">Revenue</p>
<p class="text-sm font-bold">$85,000</p>
</div>
<div class="mt-2">
<div class="flex justify-between items-center text-[10px] mb-1 uppercase font-bold tracking-tighter text-slate-400">
<span>Occupancy</span>
<span class="text-emerald-500">92%</span>
</div>
<div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
<div class="bg-emerald-500 h-full rounded-full" style="width: 92%"></div>
</div>
</div>
</div>
</div>
<!-- Hotel Card: Beach Resort -->
<div class="bg-white dark:bg-primary/40 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-primary/30 flex items-center gap-4">
<div class="w-16 h-16 rounded-lg overflow-hidden bg-slate-200 shrink-0">
<img alt="Beach Resort Tropical Poolside" class="w-full h-full object-cover" data-alt="Tropical resort with pool and palm trees" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDeVX96P_p-sn2rqz1CYDIrpV5nIctcBcHLCAn0Ar9Rz85UtYzz772OAtusf-hRk0kpYOLsy84xELaC2sJQmsdO-uFKL6N8TDbnxzm2WmuYoTbpQNwpjAjorORpFDsa2Bh4QD5E45lGIhJ9wb_kFMu2LU1oBZRj3G42jE5_eTLWwOlrP5m16BUlMkPhBh9NPjFSTBgtG8xK3k7XKk0fBcwoKo5GNtBL68ZjciPiJVIphJ6PcPvQ0cI7oJwIqLmqvRAy6KEgkOdrcXW-"/>
</div>
<div class="flex-1 min-w-0">
<h4 class="font-bold text-base truncate">Beach Resort</h4>
<div class="flex justify-between items-center mt-1">
<p class="text-xs text-slate-500 dark:text-slate-400">Revenue</p>
<p class="text-sm font-bold">$40,000</p>
</div>
<div class="mt-2">
<div class="flex justify-between items-center text-[10px] mb-1 uppercase font-bold tracking-tighter text-slate-400">
<span>Occupancy</span>
<span class="text-blue-500">78%</span>
</div>
<div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
<div class="bg-blue-500 h-full rounded-full" style="width: 78%"></div>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-primary/95 backdrop-blur-lg border-t border-slate-200 dark:border-primary/50 px-6 py-3 pb-8 flex justify-between items-center z-50">
<a class="flex flex-col items-center gap-1 active-tab text-slate-900 dark:text-white" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Dashboard</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined">corporate_fare</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Hotels</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined">analytics</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Analytics</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-bold uppercase tracking-wider">Profile</span>
</a>
</nav>
</body></html>
