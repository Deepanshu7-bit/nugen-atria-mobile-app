<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#1a2b3d",
                "background-light": "#f6f7f7",
                "background-dark": "#15191d",
              },
              fontFamily: {
                "display": ["Inter", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
          },
        }
    </script>
<title>Hotel Management Suite - Secure Login</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">
<!-- Background Gradient Layer -->
<div class="fixed inset-0 bg-gradient-to-br from-primary via-background-dark to-black -z-10"></div>
<div class="w-full max-w-[480px]">
<!-- Branding Section -->
<div class="flex flex-col items-center mb-8">
<div class="w-20 h-20 bg-primary/40 backdrop-blur-md border border-white/10 rounded-xl flex items-center justify-center mb-4 shadow-2xl">
<span class="material-symbols-outlined text-4xl text-white">apartment</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-white mb-2">Hotel Management Suite</h1>
<p class="text-slate-400 font-medium">Secure Administrator Access</p>
</div>
<!-- Login Card -->
<div class="bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-xl shadow-2xl">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-300 ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-white transition-colors">mail</span>
</div>
<input class="block w-full pl-12 pr-4 h-14 bg-background-dark/50 border border-slate-700 rounded-lg text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" name="email" placeholder="Enter your work email" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex items-center justify-between ml-1">
<label class="block text-sm font-medium text-slate-300" for="password">Password</label>
<a class="text-xs font-semibold text-slate-400 hover:text-white transition-colors uppercase tracking-wider" href="#">Forgot?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-white transition-colors">lock</span>
</div>
<input class="block w-full pl-12 pr-12 h-14 bg-background-dark/50 border border-slate-700 rounded-lg text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Biometrics -->
<div class="flex items-center justify-between">
<label class="flex items-center space-x-3 cursor-pointer group">
<input class="w-5 h-5 rounded border-slate-700 bg-background-dark/50 text-primary focus:ring-primary focus:ring-offset-background-dark" type="checkbox"/>
<span class="text-sm text-slate-400 group-hover:text-slate-200 transition-colors">Remember this device</span>
</label>
<button class="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-all border border-white/5" title="Biometric Login" type="button">
<span class="material-symbols-outlined">fingerprint</span>
</button>
</div>
<!-- Sign In Button -->
<button class="w-full h-14 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg shadow-lg shadow-primary/20 flex items-center justify-center space-x-2 transition-all active:scale-[0.98]" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-xl">login</span>
</button>
</form>
<!-- Role Detection Indicator (Initial State) -->
<div class="mt-8 pt-6 border-t border-white/10 text-center">
<div class="inline-flex items-center px-3 py-1 rounded-full bg-primary/20 border border-primary/30 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-300">
<span class="relative flex h-2 w-2 mr-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
                    Authenticating System
                </div>
</div>
</div>
<!-- Footer -->
<div class="mt-8 flex flex-col sm:flex-row items-center justify-between text-sm text-slate-500 px-2 space-y-4 sm:space-y-0">
<div class="flex items-center space-x-4">
<a class="hover:text-white transition-colors" href="#">Privacy Policy</a>
<span class="w-1 h-1 bg-slate-700 rounded-full"></span>
<a class="hover:text-white transition-colors" href="#">Technical Support</a>
</div>
<p>© 2024 Hotel Nexus v4.2</p>
</div>
</div>
<!-- Background Illustration Elements -->
<div class="fixed top-0 right-0 w-[500px] h-[500px] bg-primary/10 blur-[120px] rounded-full -z-10 translate-x-1/2 -translate-y-1/2"></div>
<div class="fixed bottom-0 left-0 w-[500px] h-[500px] bg-primary/10 blur-[120px] rounded-full -z-10 -translate-x-1/2 translate-y-1/2"></div>

<div class="hidden">
<img alt="Background pattern" data-alt="Abstract deep blue corporate gradient pattern" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArqEuPSfyFSGGuMrQ3HxMIvJvBczAxC3yxKYOuqwugAVu7HFytiRpuByS4ee6CNJeq0xUawtJnCwv_8_iY6S2tX6oQP11f7vUPGlGUxeTKX4o27-Tc-5cV5MMP99tzs9JczTJzexvRq5TinamuC140xy7KUQJmQMt9tuH1zvB1KaXwSt6znD0YkIAPz5a1Gq4Zko46j9weMckJD9LLl80aNb6Xw0oY09-DvjxtRVZXq0PP-vC0g7DUwIemWbJXFf-YdcHhsDC21GEP"/>
</div>
</body></html>
